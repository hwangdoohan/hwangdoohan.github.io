<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.end .tag{font-size:15px}
html:root:not([data-theme="zz"]){--bg:#070a07;--fg:#e8efe2;--mut:#93a58a;--card:#101510;--bd:#2b3a2b;--ac:#d4281e;--acfg:#fff;--ok:#7be08a;--no:#ff5a4d;color-scheme:dark}
body{background:radial-gradient(ellipse at 50% 0,#1c2e15 0,#070a07 62%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);animation:fl 5s infinite}

.top{gap:8px}.top b{color:var(--ac);text-shadow:0 0 8px rgba(212,40,30,.7);animation:fl 6s infinite}
.card{border-color:#3a2a2a;border-top:4px solid var(--ac);box-shadow:0 0 18px rgba(212,40,30,.18)}
.ch{background:#141b14;border-color:#3d523d}
.chip.it{background:#1a221a;color:var(--fg);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
#snd{background:var(--card);border:2px solid var(--bd);color:var(--fg);border-radius:10px;font-size:16px;padding:2px 8px;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#000;color:#fff;border:2px solid var(--ac);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;font-weight:700;text-align:center}
.art{display:block;width:100%;height:auto;border-radius:10px;margin-bottom:12px;border:2px solid var(--bd)}
body.hit::before{background:radial-gradient(ellipse at center,rgba(212,40,30,.25) 20%,rgba(160,0,0,.85) 100%)}
body.hit main{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){body::after,.top b{animation:none}}
</style>
</head>

toast:['🍶 건배 엔딩','소주 한 잔을 마시고 눈을 감았다. 운명은 생각보다 다정했다.']
});
var FD={};try{FD=JSON.parse(localStorage.getItem("sj_end")||"{}")}catch(e){}
function sv(){try{localStorage.setItem("sj_end",JSON.stringify(FD))}catch(e){}}
function rm(n){S.p=S.p.filter(function(x){return x!==n})}
function pickEv(){var p=[];EV.forEach(function(e,i){if(S.used[i]||(e.ok&&!e.ok()))return;p.push(i);if(e.ok)p.push(i);if(e.w)p.push(i,i)});if(!p.length){S.used={};return pickEv()}var i=p[Math.floor(Math.random()*p.length)];S.used[i]=1;return EV[i]}
function codex(){var k=Object.keys(E);$("view").innerHTML='<div class="card"><div class="tag">📖 엔딩 도감 '+Object.keys(FD).length+'/'+k.length+'</div><p class="story">'+k.map(function(i){return FD[i]?E[i][0]:"❓ ???"}).join("\n")+'</p></div>';var b=document.createElement("button");b.className="ch go";b.textContent="돌아가기";b.onclick=render;$("view").appendChild(b)}
function init(){LA="";S={hp:10,mind:10,food:8,day:0,p:[],used:{},fuel:0,bg:0,dr:0,sig:0,bunker:0,gun:0,kind:0,lv:0,bite:0,it:{붕대:1},job:0,jl:1,cd:0,scr:"pro",note:""}}
function stats(){items();
 $("day").textContent=S.day?"DAY "+Math.min(S.day,30)+" / 30":"프롤로그";
 var a=[["❤ 체력",S.hp,10],["🧠 정신력",S.mind,10],["🍙 식량",S.food,12]];
 $("stats").innerHTML=a.map(function(x){return '<div class="st"><small>'+x[0]+'</small><strong>'+x[1]+'</strong><div class="bar"><i style="width:'+x[1]/x[2]*100+'%"></i></div></div>'}).join("");
 $("party").innerHTML=S.p.length?S.p.map(function(n){return '<span class="chip">'+n+'</span>'}).join(""):'<span style="color:var(--mut);font-size:14px">동료 없음</span>';
}
function show(tag,txt,choices,extra){
 var v=$("view");
 v.innerHTML='<div class="card">'+ART+'<div class="tag">'+tag+'</div><p class="story">'+txt+'</p>'+(extra||"")+'</div>';
 choices.forEach(function(c){var b=document.createElement("button");b.className="ch"+(c[2]?" go":"");b.textContent=c[0];b.onclick=c[1];v.appendChild(b)});
 ART="";stats();window.scrollTo(0,0);
}
function dead(){return S.hp<=0?"hp":(S.mind<=0?"mind":null)}
function ending(id){
 var e=E[id];FD[id]=1;sv();stats();
 $("view").innerHTML='<div class="card end"><div class="tag">'+e[0]+'</div><p class="story">'+e[1]+'</p></div>';
 var b=document.createElement("button");b.className="ch go";b.textContent="처음부터 다시 하기";b.onclick=function(){init();render()};
 $("view").appendChild(b);window.scrollTo(0,0);
}
function pick(tag,fn,after){
 var b=[S.hp,S.mind,S.food],r=(PK="",fn())+pk(),a=[S.hp,S.mind,S.food],n=["체력","정신력","식량"],d="";
 for(var i=0;i<3;i++){var x=a[i]-b[i];if(x)d+='<span class="'+(x>0?"up":"dn")+'">'+n[i]+" "+(x>0?"+":"")+x+"</span>"}
 var k=dead();
 if(a[0]<b[0])hit();ART=LA;show(tag,r,[["다음",function(){if(k)return ending(k);after()},1]],d?'<div class="delta">'+d+"</div>":"");
}
function nextDay(){
 var note="",f=(S.day%3==0?1:0)+(has("탁건")&&S.day%2?1:0);
 S.food-=f;
 if(S.food<0){S.food=0;g(-1,0,0);note="굶주림으로 체력 -1. "}
 if(has("양희민")&&Math.random()<.25){g(0,0,1);note+="양희민이 먹을 것을 물어왔다. "}
 S.cd--;note+=crew();if(S.job==="의사"){g(S.jl,0,0);if(S.bite&&R(.6))S.bite=0}if(S.job==="요리사"&&S.day%3==0)g(0,0,1);if(S.job==="사냥꾼"&&R(.4))g(0,0,1);S.note=note;S.day++;if(S.dr>=3)return ending("drunk");
 var k=dead();if(k)return ending(k);
 S.day>30?final():event();
}
function event(){
 var ev=pickEv();LA=sceneFor(ev);ART=LA;
 var tx=(S.note?"["+S.note.trim()+"]\n\n":"")+ev.t;
 show("DAY "+S.day,tx,evc(ev).map(function(c){return [c[0],function(){pick("DAY "+S.day,c[1],nextDay)}]}));
}
function final2(){
 var n=S.p.length,b=S.bite,ch=[];
 ch.push(['🚗 차로 대전을 노린다',function(){end(b?'zombie':has('유대현')?(S.fuel?(n>=4?'convoy':has('양희민')?'trip':'car'):'stall'):(S.hp>=6?'walk':'walkd'))}]);
 ch.push(['🚤 금강에서 배를 띄운다',function(){end(b?'zombie':R(Math.min(.9,.45+n*.1+(S.mind>=7?.1:0)))?(has('양희민')&&n>=2?'mkboat':S.mind>=9?'calm':'boat'):(has('탁건')?'tak':'sunk'))}]);
 ch.push(['🏰 신탄진에 남아 버틴다',function(){end(b?'zombie':n>=6?'allstar':has('이상현')&&n>=4?'lol':has('이영준')&&n>=3?'crazy':has('김병준')&&has('문형준')?'bjj':has('서하윤')&&has('오지민')&&has('강태리')?'trio':has('필백')&&has('문형준')&&n>=4?'fighter':S.gun&&n>=2?'snipe':S.kind>=2?'family':S.lv&&n>=2?'romance':S.food>=10?'hoard':has('양희민')&&n>=2?'mk':n>=3?'fort':n==0&&S.mind>=8?'hermit':'alone')}]);
 ch.push(['🥾 군 대피소까지 걸어간다',function(){end(b?'zombie':S.hp>=9&&S.mind>=9?'legend':S.hp>=8?'shelter':S.hp>=4?'shelter2':'walkd')}]);
 if(S.sig)ch.push(['🚁 옥상에서 신호탄을 쏜다',function(){end('heli')}]);
 if(S.bunker)ch.push(['🕳 벙커에 틀어박힌다',function(){end('bunker')}]);
 xtra(ch,n,b);show('DAY 30 · 마지막 갈림길','30일째. 신탄진 외곽에서 길이 갈라진다.\n지금까지의 선택이 결과를 가른다.',ch);
}
function final(){return final2()}function final_old(){
 show("DAY 14 · 마지막 갈림길","신탄진 외곽, 세 갈래 길이 나온다.\n지금까지의 선택이 결과를 가른다.",[
  ["🚗 차로 대전 방면을 노린다",function(){end(has("유대현")?(S.fuel?"car":"stall"):(S.hp>=6?"walk":"walkd"))}],
  ["🚤 금강에서 배를 띄운다",function(){end(R(Math.min(.9,.3+S.p.length*.12+(S.mind>=7?.1:0)))?"boat":"sunk")}],
  ["🏰 신탄진에 남아 버틴다",function(){end(has("양희민")&&S.p.length>=2?"mk":(S.p.length>=3?"fort":"alone"))}]]);
}
function end(id){ending(id)}
function render(){
 if(S.scr==="pro"){
  show("PROLOGUE",PRO,[["📖 엔딩 도감 ("+Object.keys(FD).length+"/"+Object.keys(E).length+")",codex],["살아남기 시작한다",function(){bgm(1);
   var st=STARTS[Math.floor(Math.random()*STARTS.length)];
   show("첫 번째 선택",st.t,sh(st.c.slice()).map(function(c){return [c[0],function(){S.day=0;pick("첫 번째 선택",c[1],function(){S.day=1;event()})}]}));
  },1]]);
 }
}
init();render();
</script>
