<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>아르피아</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 픽셀 장면 + 이야기 카드 + 행동 + 상태창. 인터페이스 자체가 나이를 따라 자란다.
   0 유년기 = 크레용 그림일기(밝은 종이, 손글씨), 1 소년기 = 줄 공책(푸른 펜), 2 청년기 = 가죽 기록장(어두운 밤), 3 에필로그 = 금박 일생록. */
:root{
  --bg:#141219;--panel:#1d1a24;--raise:#262230;--line:#353043;--fg:#efe6d2;--muted:#a59c8e;
  --acc:#e3b766;--onacc:#231a0b;--sage:#93b98c;--ember:#de7a4f;--sky:#86a9db;
  --display:"Hahmlet","Gowun Batang",serif;--body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --rad:2px;--bw:1px;--fs:15px;--tilt:0deg;--paper:none;
  color-scheme:dark;
}
:root[data-stage="0"]{
  --bg:#f3e6cc;--panel:#fffaf0;--raise:#fbefd9;--line:#e0c69a;--fg:#4a3526;--muted:#8d7154;
  --acc:#e8693c;--onacc:#fff;--sage:#4f9d58;--ember:#d8473a;--sky:#3f7cc4;
  --display:"Gaegu","Gowun Dodum",cursive;--body:"Gaegu","Gowun Dodum",sans-serif;
  --rad:18px;--bw:2.5px;--fs:18px;--tilt:-.35deg;color-scheme:light;
}
:root[data-stage="1"]{
  --bg:#e5eaf0;--panel:#fbfcfe;--raise:#eef2f7;--line:#c3ccd8;--fg:#25303e;--muted:#667385;
  --acc:#2f6bb2;--onacc:#fff;--sage:#3c8a58;--ember:#c4473a;--sky:#2f6bb2;
  --display:"Gowun Batang",serif;--body:"Gowun Dodum",sans-serif;
  --rad:6px;--bw:1px;--fs:15.5px;--tilt:0deg;
  --paper:repeating-linear-gradient(180deg,transparent 0 27px,rgba(47,107,178,.12) 27px 28px);
  color-scheme:light;
}
:root[data-stage="3"]{
  --bg:#0f0d14;--panel:#17141e;--raise:#201c29;--line:#4a3f2c;--fg:#f2ead8;--muted:#a89f8c;
  --acc:#e6c27a;--onacc:#1d1508;--display:"Hahmlet","Gowun Batang",serif;--rad:0px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);transition:background-color .8s ease,color .8s ease}
body{font-family:var(--body);font-size:var(--fs);line-height:1.65}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:.8em;letter-spacing:.06em;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5.5vw,32px);margin:0;line-height:1.2}
.clock{display:flex;gap:12px;align-items:baseline}
.clock .age{font-family:var(--display);font-size:1.8em;font-weight:700;color:var(--acc);line-height:1}
.clock .sea{color:var(--fg)}
.clock .yr{font-family:var(--mono);font-size:12px;color:var(--muted)}
:root[data-stage="0"] .clock .yr{font-family:var(--body);font-size:15px}
.layout{display:grid;gap:14px}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.stage{position:relative;border:var(--bw) solid var(--line);border-radius:var(--rad);background:#000;overflow:hidden;transform:rotate(calc(var(--tilt)*-1))}
:root[data-stage="0"] .stage{border-color:#4a3526;box-shadow:4px 5px 0 rgba(74,53,38,.18)}
:root[data-stage="3"] .stage{border-color:var(--line)}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.cap{position:absolute;left:10px;top:8px;font-size:12px;letter-spacing:.06em;color:#f4ead6;text-shadow:0 1px 3px #000,0 0 8px #000;font-family:"Gowun Dodum",sans-serif}
.card{background:var(--panel);background-image:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:16px;transform:rotate(var(--tilt));transition:background-color .8s,border-color .8s}
:root[data-stage="0"] .card{box-shadow:3px 4px 0 rgba(74,53,38,.12)}
:root[data-stage="1"] .card{border-left:3px solid rgba(196,71,58,.45)}
:root[data-stage="3"] .card{border-top:1px solid var(--acc)}
.kind{font-size:.8em;letter-spacing:.06em;color:var(--acc);margin-bottom:2px}
.story h2{font-family:var(--display);font-weight:700;font-size:1.4em;margin:0 0 8px;text-wrap:balance;line-height:1.3}
:root[data-stage="0"] .story h2{font-size:1.65em}
.story .body p{margin:0 0 9px;max-width:62ch}
:root[data-stage="3"] .story .body p{font-family:"Gowun Batang",serif;font-size:16px;line-height:1.85}
.story .body p.dim{color:var(--muted);font-size:.9em}
.story .body p.quote{font-family:var(--display);font-size:1.15em;border-left:2px solid var(--acc);padding-left:12px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--mono);font-size:12px;padding:2px 8px;border:1px solid var(--line);background:var(--raise);border-radius:var(--rad)}
:root[data-stage="0"] .chip{font-family:var(--body);font-size:16px;border-width:2px;transform:rotate(-1.5deg)}
:root[data-stage="0"] .chip:nth-child(2n){transform:rotate(1.5deg)}
.chip.up{color:var(--sage)}.chip.down{color:var(--ember)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{text-align:left;background:var(--raise);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:10px 12px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--acc)}
.choice:disabled{opacity:.45;cursor:default}
.choice small{display:block;color:var(--muted);font-size:.8em}
.choice .odds{display:inline-block;margin-top:3px;font-size:.8em;color:var(--acc)}
.epnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.epnav .pg{font-family:var(--mono);font-size:12px;color:var(--muted)}
.road{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.road .not{color:var(--muted);font-size:.88em;margin-top:2px}
.aphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.aphead span{font-size:.87em;color:var(--muted)}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:14px;height:14px;border:1px solid var(--acc);transform:rotate(45deg)}
.pip.on{background:var(--acc)}
:root[data-stage="0"] .pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--acc);transform:none}
:root[data-stage="0"] .pip.on{background:radial-gradient(circle,#ffd35a 45%,var(--acc) 46%)}
:root[data-stage="1"] .pip{transform:none;border-radius:2px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:520px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--raise);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:9px 10px;cursor:pointer;min-width:0}
.act:hover:not(:disabled){border-color:var(--acc)}
.act:disabled{opacity:.4;cursor:default}
.act b{font-weight:400;font-size:1em}
.act small{font-size:.8em;color:var(--muted)}
.act .cost{font-family:var(--mono);font-size:11px;color:var(--acc)}
.act .ico{width:28px;height:28px;display:block}
:root[data-stage="0"] .act{align-items:center;text-align:center;padding:10px 6px}
:root[data-stage="0"] .act b{font-size:1.1em;font-weight:700}
.next{width:100%;margin-top:10px;background:var(--acc);color:var(--onacc);border:0;border-radius:var(--rad);padding:11px;font-weight:700;cursor:pointer}
.next:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:-6px 0 12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.93em;white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--acc)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:.87em}
.bar .tr{height:6px;background:var(--raise);position:relative;border-radius:var(--rad)}
.bar .fi{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:var(--rad)}
.bar .fi.sage{background:var(--sage)}.bar .fi.ember{background:var(--ember)}.bar .fi.sky{background:var(--sky)}
.bar .v{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cbar .tr{height:6px}.cbar .mid{position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--muted)}
.stars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.star{display:flex;justify-content:space-between;gap:6px;font-size:17px}
.star i{font-style:normal;color:var(--acc);letter-spacing:1px}
.mood{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:17px}
.mood span{background:var(--raise);border:2px solid var(--line);border-radius:14px;padding:2px 12px}
.bip{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bip .tr{height:6px;background:var(--raise);position:relative}
.bip .mk{position:absolute;top:-3px;width:4px;height:12px;background:var(--acc)}
.bip .mid{position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--line)}
.bip span:last-child{text-align:right}
.hist{margin:0;padding-left:18px;font-size:.87em;color:var(--muted)}
.hist b{color:var(--fg);font-weight:400}
.note{font-size:.8em;color:var(--muted);margin:10px 0 0}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted);font-family:"Gowun Dodum",sans-serif}
.foot button{background:none;border:1px solid var(--line);padding:4px 10px;cursor:pointer;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,8,14,.82);z-index:20;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:720px;margin:0 auto;background:var(--panel);background-image:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:20px}
.sheet h2{font-family:var(--display);font-size:1.6em;margin:2px 0 6px;text-wrap:balance}
.sheet .lead{color:var(--muted);margin:0 0 12px;max-width:62ch}
.sheet ul.unlock{margin:8px 0 0;padding-left:20px}
.sheet ul.unlock li{margin:3px 0}
.cer{text-align:center;padding-block:30px}
.cer .big{font-family:var(--display);font-size:3.2em;font-weight:700;color:var(--acc);line-height:1}
.cer ul.unlock{text-align:left;display:inline-block}
.cer h2{font-size:1.3em;text-wrap:pretty}
.field{margin-top:16px}
.field>label,.field>.lbl{display:block;font-size:.87em;color:var(--acc);margin-bottom:6px;letter-spacing:.04em}
.field input[type=text]{width:100%;max-width:260px;background:var(--raise);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:8px 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.opt{text-align:left;background:var(--raise);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:8px 10px;cursor:pointer;min-width:0}
.opt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt b{display:block;font-weight:400;font-size:.93em}
.opt small{display:block;font-size:.73em;color:var(--muted);line-height:1.4}
.sw{display:flex;gap:8px}
.sw button{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--rad);cursor:pointer}
.sw button.on{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:var(--rad);padding:10px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:400}
.lives{margin:6px 0 0;padding:0;list-style:none;font-size:.87em;color:var(--muted)}
.lives li{padding:3px 0;border-bottom:1px dashed var(--line)}
.lives b{color:var(--fg);font-weight:400}
.endsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.endsum div{background:var(--raise);border:1px solid var(--line);padding:8px;text-align:center}
.endsum b{display:block;font-family:var(--display);font-size:1.5em;color:var(--acc);line-height:1.1}
.endsum span{font-size:12px;color:var(--muted)}

/* ---- 가독성 우선 조정: 본문은 늘 고딕, 작은 글씨 13px 이상, 대비 강화, 장식 기울기·줄무늬 제거 ---- */
:root{--panel:#1f1c27;--raise:#2a2635;--line:#4a4458;--muted:#c4baa8;--fs:16px}
:root[data-stage="0"]{--body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fs:17px;--muted:#6b523c;--line:#d2b384;--acc:#c4532b;--fg:#3e2c1f;--tilt:0deg;--bw:2px;--rad:14px}
:root[data-stage="1"]{--paper:none;--muted:#4c5869;--line:#b8c2cf;--fs:16px;--fg:#1f2935}
:root[data-stage="3"]{--muted:#c6bca8;--line:#5a4e38}
.card,.stage{transform:none!important}
.card{padding:18px}
.eyebrow{font-size:13px;letter-spacing:.03em}
.clock .yr{font-size:13px}
.cap{font-size:13px;padding:3px 9px;background:rgba(10,8,16,.62);border-radius:4px;text-shadow:none;left:8px;top:8px}
.kind{font-size:13px;font-weight:700;letter-spacing:.02em}
.story h2{font-size:1.45em;margin-bottom:10px}
.story .body p{font-size:1em;line-height:1.78;margin:0 0 12px}
.story .body p.dim{font-size:14px;color:var(--muted)}
:root[data-stage="3"] .story .body p{font-size:17px;line-height:1.85}
.chips{gap:6px;margin-top:4px}
.chip,:root[data-stage="0"] .chip{font-family:var(--body);font-size:13.5px;padding:3px 10px;border-radius:999px;border-width:1px;transform:none!important;font-weight:600}
.choices{gap:10px;margin-top:14px}
.choice{padding:13px 14px;line-height:1.45;font-size:1em;font-weight:600}
.choice small{font-size:13px;margin-top:4px;line-height:1.45;font-weight:400}
.choice .odds{display:inline-block;margin-top:7px;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--acc);color:var(--acc);font-weight:700}
.choice:disabled{opacity:.62;border-style:dashed}
.aphead span{font-size:14px;color:var(--fg);font-weight:600}
.acts{gap:9px}
.act{padding:11px 12px;gap:3px}
.act b,:root[data-stage="0"] .act b{font-size:16px;font-weight:700}
.act small{font-size:13px;line-height:1.4;color:var(--muted)}
.act .cost{font-size:12px;letter-spacing:2px}
.act:disabled{opacity:.5}
.next{font-size:16px;padding:13px}
.tabs{margin:-8px 0 14px}
.tab{font-size:15px;padding:9px 12px}
.tab.on{font-weight:700}
.bars{gap:9px}
.bar{grid-template-columns:76px minmax(0,1fr) 38px;font-size:14px}
.bar .tr{height:8px}
.bar .v{font-size:13px;color:var(--fg)}
.bip{font-size:13px;grid-template-columns:48px minmax(0,1fr) 48px;color:var(--fg)}
.note{font-size:13.5px;line-height:1.6}
.hist{font-size:14px;line-height:1.6;color:var(--fg)}
.hist li{margin-bottom:5px}
.hist b{color:var(--acc);font-weight:700}
.star{font-size:16px}.mood{font-size:15px}
.road{padding-top:12px;margin-top:12px}
.road .not{font-size:13.5px;line-height:1.55}
.epnav .pg{font-size:13px}
.opt b{font-size:15px}.opt small{font-size:12.5px;line-height:1.45}
.sheet .lead{font-size:15px;line-height:1.65}
.foot{font-size:13px}

/* ---- 어두운 톤: 모든 나이에서 밤의 화면. 성장은 밝기 대신 색·글꼴·모양으로 ---- */
:root[data-stage="0"]{--bg:#1c1611;--panel:#271e17;--raise:#33281f;--line:#56432f;--fg:#f0e1c8;--muted:#c4aa86;
  --acc:#f0904f;--onacc:#1e1208;--sage:#93c98c;--ember:#f07e62;--sky:#86b6ec;color-scheme:dark}
:root[data-stage="1"]{--bg:#121822;--panel:#19212d;--raise:#212b39;--line:#384557;--fg:#e2e9f2;--muted:#a8b5c7;
  --acc:#72aaee;--onacc:#0b1320;--sage:#7fca9c;--ember:#ef8573;--sky:#72aaee;color-scheme:dark}
:root[data-stage="0"] .stage,:root[data-stage="0"] .card{box-shadow:0 3px 0 rgba(0,0,0,.35)}
:root[data-stage="0"] .stage{border-color:var(--line)}
:root[data-stage="1"] .card{border-left:3px solid rgba(239,133,115,.45)}
.autobar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.autorow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.autobtn{flex:1 1 auto;min-width:130px;background:var(--raise);border:1px solid var(--line);border-radius:var(--rad);padding:9px 12px;font-weight:700;font-size:15px;cursor:pointer;color:var(--fg)}
.autobtn.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.spd{display:flex;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.spd button{background:transparent;border:0;border-left:1px solid var(--line);padding:8px 11px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.spd button:first-child{border-left:0}
.spd button.on{background:var(--raise);color:var(--acc)}
.autorow.sub{font-size:14px;color:var(--muted)}
.autorow select{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:var(--rad);padding:6px 8px;font:inherit;font-size:14px;max-width:150px}
.autorow .chk{display:flex;align-items:center;gap:5px;cursor:pointer}
.autorow .chk input{accent-color:var(--acc);width:16px;height:16px}
.choice .odds{display:block;width:fit-content;margin-top:8px}
.ast{margin-left:auto;font-size:13px;font-weight:700;color:var(--acc)}
.ast.wait{color:var(--ember)}

/* ---- 캐릭터 생성 ---- */
.sheet:has(.cwrap){max-width:900px;padding:18px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chead h2{margin:0}
.btn.sm{padding:7px 12px;font-size:14px}
.cprev{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.cpic{flex:1 1 260px;max-width:420px;min-width:0}
.cpic canvas{display:block;width:100%;aspect-ratio:120/44;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid var(--line);border-radius:var(--rad)}

function doAction(id){
  if(S.mode!=='play')return;
  const a=ACTIONS.find(x=>x.id===id);
  if(S.ap<a.cost||(a.ok&&a.ok())||(a.lock&&a.lock()))return;
  S.ap-=a.cost;CH=[];
  const st=Math.min(2,stage());S.acts[st][id]=(S.acts[st][id]||0)+1;
  const r=ACT[id]();
  S.scene=r.scene;
  let trig=null;
  if(r.trigger)trig=EVENTS.find(e=>(e.when===r.trigger||(Array.isArray(e.when)&&e.when.includes(r.trigger)))&&!S.done[e.id]&&e.cond());
  if(trig)startEvent(trig,r.lines.join(' '));
  else S.text={kind:a.names[uiStage()]+' · '+SEASONS[season()],title:r.title,body:r.lines,chips:CH.slice()};
  save();render();
}

/* =========================================================
   판정 (사라진 나무검 설계 기준: 정신력·의지는 4배 환산해 0~100 척도에 맞춘다)
   ========================================================= */
function confrontChance(witness){
  const M=S.stat.spi*4,W=S.stat.wil*4,rel=S.rel.cassian;
  let r=rel>=20?5:rel<=-20?-5:0;
  const E=(witness?15:0)+(S.flags.sword_evidence?25:0);
  const hostile=rel<=-50?-10:0;
  const mb=M>=30?5:0;
  return clamp(45+.6*M+.4*W+r+E+hostile+mb-15,5,95);
}

function startEvent(ev,pre){
  S.mode='event';S.event=ev.id;S.scene=ev.scene();
  const b=ev.body();S.text={kind:'사건 · '+age()+'세 '+SEASONS[season()],title:ev.title,body:(pre?[pre]:[]).concat(b),chips:CH.slice()};
}
function resolveChoice(i){
  const ev=EVENTS.find(e=>e.id===S.event);if(!ev)return;
  const c=ev.choices[i];if(c.req&&!c.req())return;
  CH=[];
  let ok=true,P=null;
  if(c.chance){P=c.chance();ok=Math.random()*100<P}
  S.done[ev.id]=1;
  let res=c.run(ok);if(Array.isArray(res))res={lines:res};
  if(ev.id==='swordyard_clue'&&res.tag==='실패'&&!S.flags.gave_up_search)delete S.done[ev.id];
  const memo=res.memo||c.memo,echo=res.echo||(typeof c.echo==='function'?c.echo():c.echo);
  if(memo)S.choices.push({id:ev.id,title:ev.title,age:age(),season:season(),picked:c.label,others:ev.choices.filter((x,k)=>k!==i).map(x=>x.label),memo,echo,weight:ev.weight||1,tag:res.tag||''});
  S.mode='play';S.event=null;
  S.text={kind:(res.tag?res.tag+' · ':'선택 · ')+c.label,title:ev.title,body:res.lines,chips:CH.slice()};
  if(typeof AUTO!=='undefined')AUTO.hold=Date.now()+Math.round(3400/AUTO.speed*1.3);
  if(ev.id==='final'){beginEpilogue();return}
  save();render();
}

function pathOf(){
  const f=S.flags,k=S.skill;
  const sc={
    sword:k.sword+(f.squire?12:0)+(f.champion?12:0)+(f.cassian_recommend?6:0),
    magic:k.magic+(f.mage_student?10:0)+(f.mage_mentor?10:0)+(f.archmage?15:0)+(f.ancient_book?5:0),
    gun:k.gun+(f.marksman?15:0)+(f.greta_apprentice?8:0)+(f.bounty?8:0)-(f.gun_quit?20:0),
    martial:k.martial+(f.sect_disciple?10:0)+(f.breakthrough?15:0),
    mech:k.mech+(f.fair_win?10:0)+(f.own_workshop?10:0)+(f.sold_patent?5:0)+(f.tok?5:0),
    holy:k.holy+(f.paladin_oath?12:0)+(f.healer_pilgrim?12:0)+(f.ward_saint?6:0)-(f.left_faith?25:0),
    survival:k.survival+(f.adventurer?15:0)+(f.found_child?5:0),
    social:k.social+Math.min(15,Math.floor(S.gold/20))+(f.merchant_apprentice?10:0)+(f.fair_trader?8:0)+(f.cartel?8:0)
  };
  const e=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const[a,av]=e[0],[b,bv]=e[1];
  const LAND={sword:'castle',magic:'tower',gun:'fort',martial:'pavilion',mech:'forge',holy:'spire',survival:'camp',social:'harbor'};
  if(f.paladin_oath)return{key:'paladin',noun:'성기사',land:'spire',main:'holy',sub:'sword'};
  if(av<30)return S.rel.lina>=70&&S.per.empathy>=58?{key:'home',noun:'이웃',land:'cottage'}:{key:'wander',noun:'여행자',land:'road'};
  if(bv>=40){const pair=[a,b].sort().join('+');const MIX={'magic+sword':['magic_knight','마검사'],'gun+magic':['magic_gunner','마도 총잡이'],'mech+sword':['mech_knight','기계 기사'],'holy+sword':['paladin','성기사'],'martial+sword':['swordhero','검협'],'gun+mech':['gunwright','총포 장인'],'holy+magic':['priestmage','신관 마도사'],'holy+martial':['monk','수도승']};
    if(MIX[pair])return{key:MIX[pair][0],noun:MIX[pair][1],land:LAND[a],main:a,sub:b}}
  const N={
    sword:f.squire||f.champion||f.cassian_recommend?['knight','기사']:['swordsman','검사'],
    magic:f.archmage?['archmage','대마도사']:f.mage_student||f.mage_mentor?['mage','마도 연구자']:['hedgemage','떠돌이 마법사'],
    gun:f.marksman?['marksman','명사수']:f.bounty?['bounty','현상금 사냥꾼']:['gunner','총잡이'],
    martial:f.breakthrough?['master','문파의 고수']:f.sect_disciple?['martialist','무인']:['wandering_fist','떠돌이 무인'],
    mech:f.sold_patent?['tycoon','기술 사업가']:f.own_workshop||f.fair_win||f.open_design?['inventor','발명가']:['engineer','기술자'],
    holy:f.healer_pilgrim?['healer','치유사']:['priest','성직자'],
    survival:f.adventurer?['adventurer','모험가']:['merc','변경의 용병'],
    social:f.cartel?['tycoon_m','대상인']:['merchant','상인']
  }[a];
  return{key:N[0],noun:N[1],land:LAND[a],main:a};
}

function ell(cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry)));px(c,cx-w,cy+y,w*2+1,1)}}

function person(x,y,sp,pose,t,facing=1){

  else if(pose==='pray'||pose==='meditate'||pose==='tinker'){P(sp.top,bl-1,bodyTop+1,2,bh-3);P(sp.top,br-1,bodyTop+1,2,bh-3)}
  else if(pose!=='work'&&pose!=='sword'){P(sp.top,bl-2,bodyTop+1-(armUp?3:0),2,bh-2);P(sp.top,br,bodyTop+1-(!armUp&&pose==='dance'?3:0),2,bh-2)}
  else if(pose==='sword'){P(sp.top,bl-2,bodyTop+1,2,bh-2);P(sp.top,br,bodyTop+1,3,3)}

  if(sp.style==='long'){P(sp.hair,x-Math.floor(hw/2)-1,headTop,2,hh+3);P(sp.hair,x-Math.floor(hw/2)+hw-1,headTop,2,hh+3)}

  if(sp.style==='spiky'){P(sp.hair,x-3,headTop-3,2,2);P(sp.hair,x,headTop-3,2,2);P(sp.hair,x+2,headTop-2,2,1)}
  if(sp.noArm||sp.mechArm){for(let i=parts.length-1;i>=0;i--){const q=parts[i];if(q[0]===sp.top&&(q[1]===bl-2||q[1]===bl-1)&&q[2]>=bodyTop-3){if(sp.noArm)parts.splice(i,1);else q[0]='#8a96a8'}}}
  for(const p of parts)px(OUT,p[1]-1,p[2]-1,p[3]+2,p[4]+2);

function drawCast(env,t,spots){

    person(s[0],s[1],specOf(c.who),c.pose,t+(c.who==='player'?0:400),c.face||s[2]||1);
  }
}

function gainMod(p,d){
  if(!S||d<=0)return d;let m=1;
  if(p==='fat'){m*=1.15;if(tal('iron'))m*=.75;if(S.growth==='practical')m*=.9;return d*m}
  if(p.startsWith('rel.')){if(tal('charm'))m*=1.3;if(hasFlaw('temper'))m*=.8}
  if(p==='gold'&&S.growth==='practical')m*=1.4;
  if(p.startsWith('stat.')&&S.stat){m*=Math.max(.12,1-S.stat[p.slice(5)]/95);if(!NO_FOCUS&&S.plan){const k=p.slice(5),P=S.plan;m*=(FOCUS_ST[P.main]||[]).includes(k)?1:(FOCUS_ST[P.sub]||[]).includes(k)?.5:(GAIN_SRC==='act'?0:.4)}}
  if(p.startsWith('skill.')){
    const k=p.slice(6);
    if(k==='holy'&&tal('bless'))m*=1.5;
    if(k==='mech'&&tal('hands'))m*=1.5;
    if(k==='gun'&&tal('hawk'))m*=1.5;
    if(k==='martial'&&tal('vessel'))m*=1.5;
    if(k==='social'&&hasFlaw('stutter'))m*=.6;
    if(k==='gun'&&hasFlaw('nearsight'))m*=.6;
    m*=.85*Math.max(.04,Math.pow(1-S.skill[k]/1000,1.5));
    if(S.growth==='focus')m*=k===S.main?1.25:.85;
    else if(S.growth==='mixed')m*=S.skill[k]<20?1.3:S.skill[k]>=40?.85:1;
    else if(S.growth==='practical')m*=.95;
  }
  return d*m;
}

  for(const f of s.flaws){const F=FLAWS.find(x=>x.id===f);if(F)apply(F.mod)}

  if(t==='mind')add('stat.int',3);
  if(t==='iron')add('stat.con',2);
  if(t==='charm')add('stat.cha',2);
  if(t==='hawk'){add('stat.sen',1);s.unlock.shoot=1}
  if(t==='vessel'){add('stat.con',1);s.unlock.martial=1}
  if(t==='hands')s.unlock.tinker=1;
  if(t==='bless'){add('stat.spi',1);s.unlock.pray=1}
  if(t==='unknown'){const pool=['war','mana','sense','mind','luck','iron','charm','hawk','vessel','hands','bless'];s.hidden=pool[Math.floor(Math.random()*pool.length)]}
  Object.assign(s.roll,home.roll||{});
  (fam.unlock||[]).forEach(u=>s.unlock[u]=1);(fam.meet||[]).forEach(m=>s.met[m]=1);
  const act=FIELDS[s.main].act;if(['shoot','martial','tinker','pray'].includes(act))s.unlock[act]=1;
  for(const k in o.alloc||{})s.stat[k]=clamp(s.stat[k]+o.alloc[k],1,99);
  if(s.flaws.includes('frail'))s.hp=75;
  if(s.flaws.includes('debt'))s.gold=0;
  if(t==='iron')s.hp=Math.min(100,s.hp+15);
  if(s.startAge>6){
    const late=s.startAge===14;

    add('skill.'+s.main,late?26:12);
    for(const k of Object.keys(s.skill))if(k!==s.main&&(['gun','martial','mech','holy'].includes(k)?s.skill[k]>0:true))add('skill.'+k,late?5:2);

  const a=[];
  if(tm)a.push(`${tm.adj} 아이였다.`);
  if(tl)a.push(S.talent==='unknown'?'타고난 것이 무엇인지는 열두 살이 되어서야 드러났다.':`사람들은 그 아이가 「${tl.name}」${jo(tl.name,'을','를').slice(tl.name.length)} 타고났다고 했다.`);
  if(kp&&kp.id!=='none')a.push(`품에는 늘 ${S.family==='orphan'?kp.name+', 부모가 남긴 단 하나의 물건이':jo(kp.name,'이','가')} 있었다.`);

function keepLine(){
  const kp=KEEPSAKES.find(k=>k.id===S.keepsake);if(!kp)return'';

function future(path){

/* =========================================================
   인생의 중점에 따라 흐르는 삶 · 열린 결말
   ========================================================= */
function planOf(){
  if(!S.plan)S.plan={main:FIELDS[S.main||'sword'].act,sub:'talk',pace:'mid'};
  return S.plan;
}
function canDo(id){const a=ACTIONS.find(x=>x.id===id);return!!a&&!(a.lock&&a.lock())&&!(a.ok&&a.ok())&&S.ap>=a.cost}
function autoPick(){
  if(S.ap<=0)return null;
  const P=planOf(),restAt={easy:45,mid:62,push:82}[P.pace]||62;
  if((S.fat>=restAt||S.hp<45)&&canDo('rest'))return'rest';
  const r=Math.random();
  if(P.main&&canDo(P.main)&&r<(P.pace==='push'?.75:.62))return P.main;
  if(P.sub&&P.sub!=='none'&&canDo(P.sub)&&r<.88)return P.sub;
  if(P.pace==='easy'&&canDo('rest')&&Math.random()<.35)return'rest';
  if(canDo('talk')&&Math.random()<.28)return'talk';
  const pool=ACTIONS.filter(a=>a.id!=='rest'&&canDo(a.id)).map(a=>a.id);
  if(pool.length)return pool[Math.floor(Math.random()*pool.length)];
  return canDo('rest')?'rest':null;
}
/* 한 계절을 산다. 중간에 사건이 나면 거기서 멈춘다. */
function runSeason(){
  const head=S.seasonHead||[];S.seasonHead=null;
  const tot={},lines=[],cnt={},scenes={};
  let guard=10;
  while(S.ap>0&&S.mode==='play'&&guard--){
    const id=autoPick();if(!id)break;
    const a=ACTIONS.find(x=>x.id===id);
    S.ap-=a.cost;CH=[];
    const st=Math.min(2,stage());S.acts[st][id]=(S.acts[st][id]||0)+1;
    const r=ACT[id]();
    for(const[p,d]of CH)tot[p]=(tot[p]||0)+d;
    cnt[id]=(cnt[id]||0)+1;scenes[id]=r.scene;
    if(!lines.find(l=>l.id===id))lines.push({id,text:r.lines.join(' ')});
    let trig=null;
    if(r.trigger)trig=EVENTS.find(e=>(e.when===r.trigger||(Array.isArray(e.when)&&e.when.includes(r.trigger)))&&!S.done[e.id]&&e.cond());
    if(trig){S.scene=r.scene;startEvent(trig,head.concat([r.lines.join(' ')]).join(' '));save();render();return}
  }
  S.ap=0;
  const order=Object.entries(cnt).sort((x,y)=>y[1]-x[1]);
  const st=uiStage();
  if(!order.length){S.text={kind:`${age()}세 · ${SEASONS[season()]}`,title:`조용히 지나간 ${SEASONS[season()]}`,body:head.length?head:['특별한 일 없이 계절이 지나갔다.'],chips:[]};save();render();return}
  const topA=ACTIONS.find(x=>x.id===order[0][0]),nm=topA.names[st];
  S.scene=scenes[order[0][0]];
  const tally=order.map(([id,n])=>`${ACTIONS.find(x=>x.id===id).names[st]} ${n}번`).join(', ');
  const ordered=order.map(([id])=>lines.find(l=>l.id===id)).filter(Boolean).slice(0,3).map(l=>l.text);
  S.text={kind:`${age()}세 · ${SEASONS[season()]}`,title:`${jo(nm,'으로','로')} 보낸 ${SEASONS[season()]}`,
    body:head.concat(ordered,[st===0?`이번 계절에 한 일: ${tally}`:`이번 계절 · ${tally}`]),
    chips:Object.entries(tot).map(([p,d])=>[p,Math.round(d)]).filter(x=>x[1])};
  save();render();
}
function liveTick(){
  if(S.mode!=='play')return;
  if(S.turn>=48&&S.done.final){beginEpilogue();return}
  if(S.ap<=0){nextSeason();if(S.mode!=='play')return}
  runSeason();
}

function baseDelay(){return Math.round(1700/AUTO.speed)}
function setAuto(on){AUTO.on=on;clearTimeout(AUTO.timer);AUTO.timer=null;if(on)schedule(250);if(S)renderActions(uiStage())}
function schedule(ms){AUTO.timer=setTimeout(autoTick,ms!=null?ms:baseDelay())}
function autoTick(){
  AUTO.timer=null;
  if(!AUTO.on||!S)return;
  if(S.mode==='epilogue'){setAuto(false);return}
  if(!$('#modal').hidden){schedule(400);return}
  const now=Date.now();if(AUTO.hold&&now<AUTO.hold){schedule(AUTO.hold-now);return}
  if(S.mode==='event'){
    if(!AUTO.events){renderActions(uiStage());schedule(400);return}
    const ev=EVENTS.find(e=>e.id===S.event);
    const ok=ev.choices.map((c,i)=>({c,i})).filter(o=>!o.c.req||o.c.req());
    ok.forEach(o=>o.score=(o.c.chance?o.c.chance():65)+Math.random()*45);ok.sort((x,y)=>y.score-x.score);
    resolveChoice(ok[0].i);
    if(!AUTO.on||S.mode==='epilogue'){setAuto(false);return}
    schedule();return;
  }
  liveTick();
  if(S.mode==='epilogue'){setAuto(false);return}
  schedule(S.mode==='event'?400:baseDelay());
}

['tournament','rival','marksman','qi_deviation','magic_thesis','guild_test','missing_sword','final','ruins','wolves','misfire','hara_spar','mountain_gate','invention_fair','oath'].forEach(id=>{const e=EVENTS.find(x=>x.id===id);if(e)e.epic=true});
/* =========================================================
   무작위 사건 100개 — 인생마다 일부만 나타난다
   형식: X(id,[나이],제목,본문,장면,[[선택,확률,성공결과,실패결과,옵션]...],옵션)
   결과: [문장, {효과}, {flag,memo,echo,hist,cine}]
   ========================================================= */
function inPool(id){return(hashStr(String(S.seed)+id)%100)<62}
function applyFx(fx){
  for(const k in fx){const v=fx[k];
    if(k==='gold%')add('gold',Math.round(S.gold*v));
    else if(k==='job'){if(S.job){if(v>0&&S.job.tier<4)promote();else if(v<0&&S.job.tier>1){S.job.tier--;S.job.history.push({age:age(),title:jobTitle()});logIt('job',jobTitle(),'직위를 잃고 한 단계 내려왔다.')}}}
    else if(k==='injury')S.injury=Math.max(S.injury,v);
    else if(k==='debt')S.debt+=v;
    else if(k==='unlock')S.unlock[v]=1;
    else if(k==='meet')S.met[v]=1;
    else add(k,v);
  }
}
function outcome(o,tag){
  const[text,fx,ex]=o;const e=ex||{};applyFx(fx||{});
  if(e.flag)S.flags[e.flag]=age();if(e.hist)hist(e.hist);if(e.cine)cine(e.cine[0],e.cine[1],e.cine[2]||'');
  return{lines:Array.isArray(text)?text:[text],memo:e.memo,echo:e.echo,tag};
}
function sceneSpec(s){const[id,tod,variant,cast]=s.split('/');return{id,tod:tod||'day',variant:variant||'',season:isAdult()?rint(4):season(),st:Math.min(3,stage()),cast:[{who:'player',spot:'p',pose:'idle'}].concat((cast||'').split(',').filter(Boolean).map((w,i)=>({who:w,spot:i?'l':'r',pose:'idle',face:-1})))}}
function X(id,ages,title,body,scene,choices,opt){
  opt=opt||{};
  EVENTS.push({id,pool:true,when:['season','year'],weight:opt.w||2,epic:!!opt.epic,
    cond:()=>age()>=ages[0]&&age()<=ages[1]&&inPool(id)&&(!opt.cond||opt.cond()),
    scene:()=>sceneSpec(scene),title,
    body:()=>{const b=typeof body==='function'?body():body;return Array.isArray(b)?b:[b]},
    choices:choices.map(([label,chance,ok,ng,o2])=>{const c={label,run(v){return chance?(v?outcome(ok,'성공'):outcome(ng||ok,'실패')):outcome(ok,'')}};if(chance)c.chance=chance;if(o2){if(o2.req){c.req=o2.req;c.reqText=o2.reqText}if(o2.sub)c.sub=o2.sub}return c})});
}
const BC=()=>bestOf(COMBAT),SK=k=>S.skill[k],ST=k=>S.stat[k];

function gearName(){return S.gear?GEAR[S.gear.kind][S.gear.tier-1]:''}
function gearBonus(k){return S.gear&&S.gear.kind===k?S.gear.tier*6:0}
function bestStyle(){return Object.keys(FSTY).sort((a,b)=>(S.skill[b]+gearBonus(b)*5)-(S.skill[a]+gearBonus(a)*5))[0]}
function fillFoe(t,foe){return t.replace(/\{foe(이|을|은)\}/g,(m,p)=>jo(foe,p,p==='이'?'가':p==='을'?'를':'는'))}
function fightChance(k,diff,bonus){return C(32+(S.skill[k]-diff)/5+S.stat[FSTY[k].stat]/2+gearBonus(k)+(bonus||0),4,85)}
function fightChoices(sit){
  const keys=Object.keys(FSTY).filter(k=>S.skill[k]>=12||gearBonus(k)).sort((a,b)=>(S.skill[b]+gearBonus(b)*5)-(S.skill[a]+gearBonus(a)*5)).slice(0,sit.n||3);
  if(!keys.length)keys.push(S.skill.martial>=S.skill.sword?'martial':'sword');
  return keys.map(k=>{const F=FSTY[k];const gn=S.gear&&S.gear.kind===k?' · '+gearName():'';
    return{label:sit.verb&&sit.verb[k]||F.verb,sub:`${F.name} ${S.skill[k]}${gn}`,chance:()=>fightChance(k,sit.diff,sit.bonus?sit.bonus():0),run(ok){
      const o=ok?sit.win:sit.lose;const lines=[fillFoe(ok?F.win:F.lose,sit.foe)].concat(o.text?[o.text]:[]);
      applyFx(o.fx||{});if(o.flag)S.flags[o.flag]=age();
      add('skill.'+k,ok?(sit.gain||8):3);
      if(ok&&o.cine)cine('win',o.cine,`${F.tool}${jo(F.tool,'으로','로').slice(F.tool.length)}`);
      if(sit.after)sit.after(ok,k);
      const memo=o.memo?`${jo(F.tool,'으로','로')} ${o.memo}`:null;
      return{lines,memo,echo:o.echo,tag:ok?'성공':'실패'};
    }}});
}
function weaponize(id,idx,mk){
  const e=EVENTS.find(x=>x.id===id);if(!e)return;
  const d=Object.getOwnPropertyDescriptor(e,'choices');const orig=d.get?null:e.choices.slice();
  Object.defineProperty(e,'choices',{get(){const arr=(d.get?d.get.call(e):orig).slice();arr.splice(idx,1,...fightChoices(mk()));return arr},configurable:true});
}

EVENTS.push({id:'forge',when:'year',repeat:true,weight:4,cond:()=>S.gear&&S.gear.tier<4&&age()>=(S.flags.forgeCd||0)&&S.gold>=forgeCost(),
  scene:()=>({id:'workshop',tod:'night',season:rint(4),st:3,cast:[{who:'player',spot:'p',pose:'idle'},{who:'greta',spot:'r',pose:'idle',face:-1}]}),
  title:'대장간의 불',body:()=>[`이름난 장인이 네 「${gearName()}」을 보고 혀를 찼다. "제대로 손보면 다른 물건이 될 거요. 값은 ${forgeCost()}."`.replace('」을',`」${jo(gearName(),'을','를').slice(gearName().length)}`)],
  get choices(){const best=bestStyle();const c=[
   {label:'강화를 맡긴다',sub:`자금 ${forgeCost()} · 실패하면 돈만 날린다`,chance:()=>C(55+S.skill.mech/10),run(ok){add('gold',-forgeCost());S.flags.forgeCd=age()+4;if(ok){S.gear.tier++;logIt('job',gearName(),'무기를 강화했다.');cine('job',gearName(),'무기 강화');return{lines:[`불꽃 속에서 「${gearName()}」이 태어났다.`],memo:`무기를 「${gearName()}」로 벼렸다`,tag:'성공'}}return{lines:['담금질에서 금이 갔다. 돈만 날렸다.'],tag:'실패'}}},
   {label:'지금 것으로 충분하다',run(){S.flags.forgeCd=age()+3;return['장인이 어깨를 으쓱했다.']}}];
   if(best!==S.gear.kind&&S.skill[best]>S.skill[S.gear.kind]+60)c.splice(1,0,{label:`${FSTY[best].name} 무기로 바꾼다`,sub:`「${GEAR[best][Math.max(0,S.gear.tier-2)]}」`,run(){S.gear={kind:best,tier:Math.max(1,S.gear.tier-1)};S.flags.forgeCd=age()+3;logIt('job',gearName(),'손에 맞는 무기로 바꿨다.');return{lines:[`손에 익은 무기를 내려놓고 「${gearName()}」을 들었다.`.replace('」을',`」${jo(gearName(),'을','를').slice(gearName().length)}`)],memo:`무기를 ${FSTY[best].name}으로 바꿨다`}}});
   return c}});
function forgeCost(){return S.gear?60*S.gear.tier+40:999}

const MAJOR=new Set(['missing_sword','cas_first','cas_reunion','cas_duel','cassian_offer','cas_wager','tournament','academy','final','promotion','career_change','lina_leave','bark_ill','emil_secret','emil_crown','lina_reunion','cas_fallen','rematch','mentor_farewell','love','war_call','great_beast','revolution','last_duel','betrayal','old_enemy','dark_offer','prosthetic','lesson']);
function isMajor(ev){
  if(!ev)return false;
  if(ev.epic||MAJOR.has(ev.id))return true;
  if(/^(nem_|key_|r_)/.test(ev.id))return true;
  if(ev.id==='dg_room'&&S.dg&&S.dg.rooms[S.dg.i]==='boss')return true;
  return false;

const _seQ=startEvent;
startEvent=function(ev,pre){
  ensureQ();_seQ(ev,pre);

const _rcQ=resolveChoice;
resolveChoice=function(i){
  ensureQ();
  const ev=EVENTS.find(e=>e.id===S.event);if(!ev||DUEL)return;
  const c=ev.choices[i];if(!c||c.req&&!c.req())return;
  if(c.duel&&DUEL_FORCE===null){
    startDuel(c.duel,win=>{DUEL_FORCE=win;try{_rcQ(i)}finally{DUEL_FORCE=null}afterResolve(ev,true)});
    return;
  }
  const direct=!AUTO_PICKING;
  _rcQ(i);
  afterResolve(ev,direct);
};
function afterResolve(ev,direct){
  if(!S||S.dead||S.mode==='epilogue'){achCheck();return}
  if(direct&&isMajor(ev)){
    const was=S.resolve;S.resolve=Math.min(5,S.resolve+1);
    if(S.text&&S.resolve>was){S.text.chips=(S.text.chips||[]).concat([['resolve',1]])}
  }
  achCheck();
  if(S.dg&&S.mode==='play'&&S.dg.i<S.dg.rooms.length){
    const pre=(S.text&&S.text.body||[]).join(' ');
    startEvent(EVENTS.find(e=>e.id==='dg_room'),pre);
  }else if(S.mode==='play'&&!S.dg&&S.chainTurn!==S.turn&&!isChain(ev)){
    const nx=EVENTS.find(e=>isChain(e)&&!S.done[e.id]&&(isAdult()?whenHas(e,'year'):whenHas(e,'season'))&&e.cond());
    if(nx){S.chainTurn=S.turn;startEvent(nx,'같은 해, 또 하나의 일이 찾아왔다.')}

}

autoTick=function(){
  AUTO.timer=null;
  if(!AUTO.on||!S)return;
  if(S.mode==='epilogue'){setAuto(false);return}
  if(!$('#modal').hidden||DUEL){schedule(400);return}
  const now=Date.now();if(AUTO.hold&&now<AUTO.hold){schedule(AUTO.hold-now);return}
  if(S.mode==='event'){
    const ev=EVENTS.find(e=>e.id===S.event);
    if(!AUTO.events||isMajor(ev)){renderActions(uiStage());schedule(400);return}
    const ok=ev.choices.map((c,i)=>({c,i})).filter(o=>(!o.c.req||o.c.req())&&!o.c.duel);
    if(!ok.length){renderActions(uiStage());schedule(400);return}
    ok.forEach(o=>o.score=(o.c.chance?o.c.chance():65)+Math.random()*45);ok.sort((x,y)=>y.score-x.score);
    AUTO_PICKING=true;try{resolveChoice(ok[0].i)}finally{AUTO_PICKING=false}
    if(!AUTO.on||S.mode==='epilogue'){setAuto(false);return}
    schedule();return;
  }
  liveTick();
  if(S.mode==='epilogue'){setAuto(false);return}
  schedule(S.mode==='event'?400:baseDelay());
};

function topStyle(){const ks=Object.keys(FSTY).filter(x=>S.skill[x]>=12||gearBonus(x)).sort((a,b)=>(S.skill[b]+gearBonus(b)*5)-(S.skill[a]+gearBonus(a)*5));return ks[0]||(S.skill.martial>=S.skill.sword?'martial':'sword')}
function startDuel(d,onEnd){
  const k=d.style||topStyle();
  const pow=S.skill[k]+gearBonus(k)*5+S.stat[FSTY[k].stat]*3+(d.bonus||0)*4;
  const pmax=Math.max(2,Math.min(6,3+(S.hp>=60?1:0)+Math.floor(S.skill[k]/300)-(hasWound('arm')?1:0)));
  const emax=Math.min(7,3+Math.floor(d.diff/220));
  if(S.talent==='sword_saint'&&k==='sword')S.resolve=Math.min(5,S.resolve+1);
  DUEL={foe:d.foe,diff:d.diff,k,pow,php:pmax,pmax,ehp:emax,emax,round:1,charged:false,done:false,onEnd,log:[`${jo(d.foe,'과','와')} 마주 섰다. 상대의 움직임을 읽고 한 합씩 고른다.`]};
  if(S.scene&&S.scene.cast)S.scene.cast=S.scene.cast.map(c=>c.who==='player'?Object.assign({},c,{pose:k==='gun'?'shoot':(k==='magic'||k==='holy')?'pray':k==='mech'?'tinker':'sword'}):c);
  nextIntent();curKey='';render();
}
function nextIntent(){
  const D=DUEL;const r=Math.random();
  D.intent=D.charged?'charge_go':r<.36?'strike':r<.6?'feint':r<.8?'guard':'charge';
  const acc=clamp(.45+S.stat.sen/150+S.skill[D.k]/2500,.45,.95);
  D.read=D.intent==='charge_go'||Math.random()<acc;
}
function duelAct(a){
  const D=DUEL;if(!D||D.done)return;
  if(a==='skl'){if(S.resolve<1)return;S.resolve--}
  const hitP=clamp(.58+(D.pow-D.diff)/900,.3,.93),eHit=clamp(.55+(D.diff-D.pow)/900,.25,.88);
  const ph=()=>Math.random()<hitP,eh=()=>Math.random()<eHit,mv=STY_MOVES[D.k];
  const it=D.intent;let dp=0,de=0;const L=[];
  if(it==='strike'){
    if(a==='atk'){if(ph()){de=1;L.push(`${mv[0]}! 서로의 공격이 엇갈렸다.`)}else L.push(`${mv[0]}${jo(mv[0],'이','가').slice(mv[0].length)} 빗나갔다.`);if(eh()){dp=2;L.push('상대의 강타가 그대로 꽂혔다.')}}
    else if(a==='grd'){if(eh()&&Math.random()<.35){dp=1;L.push('막았지만 충격이 팔을 타고 올라왔다.')}else L.push('강타를 정면으로 받아 냈다.');if(Math.random()<hitP*.6){de=1;L.push('막아 낸 틈에 반격!')}}
    else if(a==='dge'){if(Math.random()<.85){L.push('몸을 비틀어 강타를 흘렸다.');if(ph()){de=1;L.push('빈 옆구리에 반격!')}}else{dp=2;L.push('피하려 했지만 반 박자 늦었다.')}}
    else{de=2;L.push(`${mv[1]}! 결의를 담은 일격이 꽂혔다.`);if(eh()){dp=1;L.push('상대의 강타도 함께 들어왔다.')}}
  }else if(it==='feint'){
    if(a==='atk'){if(ph()){de=1;L.push(`${mv[0]}${jo(mv[0],'이','가').slice(mv[0].length)} 견제를 뚫고 들어갔다.`)}else L.push('견제에 걸려 헛손질했다.')}
    else if(a==='grd'){if(eh()){dp=1;L.push('웅크린 사이 가벼운 일격이 옆으로 들어왔다.')}else L.push('서로 탐색만 했다.')}
    else if(a==='dge'){if(eh()){dp=1;L.push('피한 방향을 읽혔다.')}else L.push('거리를 벌렸다.')}
    else{de=2;L.push(`${mv[1]}! 견제를 무시하고 꽂아 넣었다.`)}
  }else if(it==='guard'){
    if(a==='atk'){if(Math.random()<hitP*.35){de=1;L.push('단단한 방어 위로 억지로 밀어붙였다.')}else L.push('단단한 방어에 막혔다.')}
    else if(a==='skl'){de=1;L.push(`${mv[1]}${jo(mv[1],'이','가').slice(mv[1].length)} 방어를 깨뜨렸다.`)}
    else L.push('서로 숨을 고르며 노려봤다.');
  }else if(it==='charge'){
    D.charged=true;
    if(a==='atk'){if(ph()){de=2;D.charged=false;L.push(`힘을 모으는 틈을 파고든 ${mv[0]}! 기술이 끊겼다.`)}else L.push('파고들었지만 닿지 않았다. 상대의 기운이 커진다.')}
    else if(a==='skl'){de=2;D.charged=false;L.push(`${mv[1]}${jo(mv[1],'이','가').slice(mv[1].length)} 모으던 힘째로 상대를 날렸다.`)}
    else L.push('기다리는 사이 상대의 기운이 점점 커진다…');
  }else{
    D.charged=false;
    if(a==='dge'){if(Math.random()<.8)L.push('필살기를 종이 한 장 차이로 피했다!');else{dp=3;L.push('피하지 못했다. 필살기가 정통으로 들어왔다.')}}
    else if(a==='grd'){dp=1;L.push('필살기를 막아 냈다. 무기를 쥔 손이 저렸다.')}
    else if(a==='skl'){de=2;dp=1;L.push(`필살기와 ${mv[1]}${jo(mv[1],'이','가').slice(mv[1].length)} 정면으로 부딪쳤다!`)}
    else{dp=3;if(ph())de=1;L.push('정면으로 들어갔다가 필살기에 휩쓸렸다.')}
  }
  D.php=Math.max(0,D.php-dp);D.ehp=Math.max(0,D.ehp-de);
  if(dp||de){FX.flash=dp?.35:.25;FX.col=dp?'150,20,30':'255,240,200'}
  const AN={atk:mv[0],grd:'방어',dge:'회피',skl:mv[1]};
  D.log=[`제${D.round}합 · 나의 「${AN[a]}」 · 상대의 「${INTENTS[it].k}」`].concat(L);
  D.round++;
  if(D.php<=0||D.ehp<=0||D.round>10){
    D.done=true;const win=D.ehp<=0?true:D.php<=0?false:(D.php/D.pmax>=D.ehp/D.emax);D.win=win;
    D.log.push(win?`${jo(D.foe,'이','가')} 무너졌다. 승리!`:'더는 버틸 수 없었다. 패배.');
    if(win)S.duelWins++;else S.resolve=Math.min(5,S.resolve+1);
    render();
    setTimeout(()=>{const cb=D.onEnd;DUEL=null;cb(win)},1600);
    return;
  }
  nextIntent();render();
}
function renderDuel(){
  const D=DUEL,ch=$('#choices');if(!D||!ch)return;
  const H=(n,m)=>`<span class="hp" aria-label="${n}/${m}">${'<i class="on"></i>'.repeat(n)}${'<i></i>'.repeat(m-n)}</span>`;
  const mv=STY_MOVES[D.k],it=INTENTS[D.intent];
  ch.innerHTML=`<div class="duel ${D.done?(D.win?'won':'lost'):''}">
   <div class="dtop"><div><b>${esc(S.name)}</b>${H(D.php,D.pmax)}<small>${FSTY[D.k].name} ${S.skill[D.k]}</small></div><div class="dvs">${D.done?'결착':`제${D.round}합`}</div><div class="r"><b>${esc(D.foe)}</b>${H(D.ehp,D.emax)}<small>위협 ${D.diff}</small></div></div>
   ${D.done?'':`<p class="tell">${D.read?`<b>${it.k}</b> ${esc(jo(D.foe,'이','가'))} ${it.t}.`:`<b>?</b> ${esc(D.foe)}의 다음 수를 읽을 수 없다.`}</p>`}
   <div class="dlog">${D.log.map(l=>`<p>${esc(l)}</p>`).join('')}</div>
   ${D.done?'':`<div class="dacts">
    <button class="choice" data-da="atk">${mv[0]}<small>견제와 힘 모으기를 끊는다</small></button>
    <button class="choice" data-da="grd">방어<small>강타와 필살기를 버틴다</small></button>
    <button class="choice" data-da="dge">회피<small>강타를 흘리고 반격한다</small></button>
    <button class="choice" data-da="skl" ${S.resolve<1?'disabled':''}>${mv[1]}<small>결의 1 소모 · 반드시 들어간다 · 남은 결의 ${S.resolve}</small></button></div>`}
  </div>`;
  ch.querySelectorAll('[data-da]').forEach(b=>b.onclick=()=>duelAct(b.dataset.da));
}

const _fcQ=fightChoices;
fightChoices=function(sit){
  const arr=_fcQ(sit);
  arr.forEach(c=>{const run=c.run;c.run=function(ok){const r=run.call(this,ok);
    if(!ok&&!S.pendingDeath&&!sit.noLesson&&(sit.diff>=90||sit.major)&&age()>=(S.lessonCd||0)){S.lessonCd=age()+3;S.lessonQ={foe:sit.foe,diff:sit.diff,age:age()};S.revenge={foe:sit.foe,diff:Math.round(sit.diff*1.1),at:age()+(isAdult()?4:2),bonus:0,lostAge:age()}}
    return r}});
  if((sit.risk>=1||sit.major)&&age()>=8&&arr.length&&!sit.noDuel){
    const c0=arr[0],k=topStyle(),bon=()=>sit.bonus?sit.bonus():0;
    arr.unshift({label:`⚔ 직접 겨룬다`,sub:`결투 · 상대의 수를 읽고 ${STY_MOVES[k][0]}·방어·회피·${STY_MOVES[k][1]}를 고른다`,duel:{foe:sit.foe,diff:sit.diff,style:k,bonus:bon()},
      chance:()=>DUEL_FORCE===null?fightChance(k,sit.diff,bon()+5):(DUEL_FORCE?100:0),
      run(ok){const r=c0.run.call(this,ok);r.lines=r.lines||[];if(ok){add('skill.'+k,6);r.lines.push('직접 겨뤄 얻은 승리였다. 손끝이 그 감각을 기억했다.')}else r.lines.push('졌지만 한 합 한 합이 몸에 새겨졌다.');return r}});
  }
  return arr;
};

  <div class="row"><button class="btn" id="born">태어나기</button>${S&&!S.dummy&&S.mode!=='epilogue'?'<button class="btn ghost" id="cancel">이어서 하기</button>':''}</div>`;
  $('#modal').hidden=false;
  sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pickSt[b.dataset.k]=b.dataset.v;pickSt.name=$('#nm').value;openCreate()});
  sh.querySelectorAll('[data-hair]').forEach(b=>b.onclick=()=>{pickSt.hair=+b.dataset.hair;pickSt.name=$('#nm').value;openCreate()});
  $('#born').onclick=()=>{pickSt.name=($('#nm').value||'아렌').trim().slice(0,8)||'아렌';newLife(pickSt);startEvent(EVENTS[0],'');save();$('#modal').hidden=true;curKey='';tab=null;render()};
  const c=$('#cancel');if(c)c.onclick=()=>{$('#modal').hidden=true};
}
$('#newBtn').onclick=()=>{
  $('#sheet').innerHTML=`<h2>새 인생을 시작할까?</h2><p class="lead">지금의 삶은 지워진다. 끝까지 산 삶은 '이전의 삶'에 남는다.</p><div class="row"><button class="btn" id="y">새로 태어나기</button><button class="btn ghost" id="n">취소</button></div>`;
  $('#modal').hidden=false;$('#y').onclick=openCreate;$('#n').onclick=()=>{$('#modal').hidden=true};
};


/* ---------- 자동 진행 ---------- */
const AUTO={on:false,speed:2,focus:'balance',events:false,timer:null,key:''};
try{const a=JSON.parse(localStorage.getItem('mof-auto')||'{}');if([1,2,4,8,16].includes(a.speed))AUTO.speed=a.speed;if(a.focus)AUTO.focus=a.focus;AUTO.events=!!a.events}catch(e){}
function saveAuto(){try{localStorage.setItem('mof-auto',JSON.stringify({speed:AUTO.speed,focus:AUTO.focus,events:AUTO.events}))}catch(e){}}
function autoOpts(st){return[['balance',st===0?'골고루':'균형 있게']].concat(ACTIONS.filter(a=>!(a.lock&&a.lock())&&a.id!=='rest').map(a=>[a.id,a.names[st]]))}
function renderAuto_old(){
  const el=$('#autobar');if(!el||!S)return;
  const st=uiStage(),opts=autoOpts(st);
  if(!opts.find(o=>o[0]===AUTO.focus))AUTO.focus='balance';
  const key=st+'|'+opts.map(o=>o[0]).join(',');
  if(key!==AUTO.key){
    AUTO.key=key;
    el.innerHTML=`<div class="autorow"><button class="autobtn" id="autoTog"></button><div class="spd" role="group" aria-label="배속">${[1,2,4,8].map(v=>`<button data-spd="${v}" aria-label="${v}배속">${v}×</button>`).join('')}</div></div>
    <div class="autorow sub"><label for="autoFocus">${st===0?'주로 할 일':'중점'}</label><select id="autoFocus">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select><label class="chk"><input type="checkbox" id="autoEv"> 사건도 맡기기</label><span class="ast" id="autoSt"></span></div>`;
    el.querySelector('#autoTog').onclick=()=>setAuto(!AUTO.on);
    el.querySelectorAll('[data-spd]').forEach(b=>b.onclick=()=>{AUTO.speed=+b.dataset.spd;saveAuto();renderAuto();if(AUTO.on){clearTimeout(AUTO.timer);schedule(150)}});
    el.querySelector('#autoFocus').onchange=e=>{AUTO.focus=e.target.value;saveAuto()};
    el.querySelector('#autoEv').onchange=e=>{AUTO.events=e.target.checked;saveAuto();renderAuto()};
  }
  const tog=el.querySelector('#autoTog');tog.classList.toggle('on',AUTO.on);tog.textContent=AUTO.on?'❚❚ 멈추기':'▶ 자동 진행';
  el.querySelectorAll('[data-spd]').forEach(b=>b.classList.toggle('on',+b.dataset.spd===AUTO.speed));
  el.querySelector('#autoFocus').value=AUTO.focus;el.querySelector('#autoEv').checked=AUTO.events;
  const s=el.querySelector('#autoSt');
  const wait=AUTO.on&&S.mode==='event'&&!AUTO.events;
  s.textContent=!AUTO.on?'':wait?(st===0?'골라 주면 다시 갈게요':'선택을 기다리는 중'):`${AUTO.speed}배속 진행 중`;
  s.classList.toggle('wait',wait);
}
function setAuto_old(on){AUTO.on=on;clearTimeout(AUTO.timer);AUTO.timer=null;if(on)schedule(200);renderAuto()}
function schedule_old(ms){AUTO.timer=setTimeout(autoTick,ms!=null?ms:Math.round(1400/AUTO.speed))}
function canDo_old(id){const a=ACTIONS.find(x=>x.id===id);return!!a&&!(a.lock&&a.lock())&&!(a.ok&&a.ok())&&S.ap>=a.cost}
function autoPick_old(){
  if(S.ap<=0)return null;
  if((S.fat>=65||S.hp<45)&&canDo('rest'))return'rest';
  if(AUTO.focus!=='balance'&&canDo(AUTO.focus)&&Math.random()<.8)return AUTO.focus;
  const pool=ACTIONS.filter(a=>a.id!=='rest'&&canDo(a.id)).map(a=>a.id);
  if(!pool.length)return canDo('rest')?'rest':null;
  if(AUTO.focus==='balance'){const st=Math.min(2,stage()),cnt=id=>S.acts[st][id]||0;pool.sort((x,y)=>cnt(x)-cnt(y)+(Math.random()-.5)*2.5);return pool[0]}
  return pool[Math.floor(Math.random()*pool.length)];
}
function autoTick_old(){
  AUTO.timer=null;
  if(!AUTO.on||!S)return;
  if(S.mode==='epilogue'){setAuto(false);return}
  const modal=$('#modal');
  if(!modal.hidden){if(S.ceremony){S.ceremony=null;save();modal.hidden=true;render();schedule();return}schedule(500);return}
  let slow=1;
  if(S.mode==='event'){
    if(!AUTO.events){renderAuto();schedule(400);return}
    const ev=EVENTS.find(e=>e.id===S.event);
    const ok=ev.choices.map((c,i)=>({c,i})).filter(o=>!o.c.req||o.c.req());
    ok.forEach(o=>o.score=(o.c.chance?o.c.chance():65)+Math.random()*45);ok.sort((x,y)=>y.score-x.score);
    resolveChoice(ok[0].i);slow=2;
  }else if(S.mode==='play'){
    const id=autoPick();
    if(id)doAction(id);else nextSeason();
    if(S.mode==='event')slow=2.2;
  }
  if(!AUTO.on)return;
  if(S.mode==='epilogue'){setAuto(false);return}
  schedule(Math.round(1400/AUTO.speed*slow));
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AUTO.on)setAuto(false)});

/* ---------- 시작 ---------- */
window.DBG={set(o){Object.assign(S.scene,o);curKey='';render()},state:()=>S,setS(o){Object.assign(S,o);render()},epi:beginEpilogue};
S=load();
if(!S){newLife(pickSt);S.dummy=true;S.scene={id:'home',tod:'dusk',cast:[{who:'player',spot:'p',pose:'idle'}]};S.text={kind:'',title:'',body:[]};render();openCreate()}
else render();
requestAnimationFrame(frame);

</script>
